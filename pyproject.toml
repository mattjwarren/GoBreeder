[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gobreeder"
version = "0.1.0"
description = "Genetic-programming system that evolves Go-playing programs"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.0",
    "pyside6>=6.6",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
    "pytest-qt>=4.4",
]

[project.scripts]
gobreeder-gui = "GoBreeder.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["GoBreeder/breed", "GoBreeder/gui"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP031"]  # E501: long lines; UP031: % formatting in legacy debug code

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
]
